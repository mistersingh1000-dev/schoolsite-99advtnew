<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DEMS School Download Center for results, academic calendars, schedules, reports and presentations.">
    <title>DEMS School Download Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"]
            },
            colors: {
              school: {
                dark: "#1F2937",
                blue: "#2563EB",
                soft: "#EFF6FF"
              }
            },
            boxShadow: {
              premium: "0 24px 70px rgba(15, 23, 42, 0.14)"
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-[#f3f7ff] font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-white">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useMemo, useState } = React;
      const h = React.createElement;

      const downloads = [
        {
          id: "ssc-result",
          title: "DEMS SSC RESULT 2021-2025",
          category: "Results",
          type: "XLSX",
          size: "9.5 KB",
          date: "30 May 2026",
          path: "/public/downloads/dems-ssc-result-2021-2025.xlsx",
          description: "SSC result record for academic years 2021 to 2025."
        },
        {
          id: "holidays",
          title: "LIST OF HOLIDAYS 2026-27",
          category: "Academic",
          type: "JPG",
          size: "138 KB",
          date: "30 May 2026",
          path: "/public/downloads/list-of-holidays-2026-27.jpeg",
          description: "Holiday list for the 2026-27 academic session."
        },
        {
          id: "cce-schedule",
          title: "CCE EXAM SCHEDULE 2026-27",
          category: "Exams",
          type: "JPG",
          size: "47 KB",
          date: "30 May 2026",
          path: "/public/downloads/cce-exam-schedule-2026-27.jpeg",
          description: "CCE subject-wise examination schedule for both terms."
        },
        {
          id: "exam-schedule",
          title: "EXAM SCHEDULE 2025-26",
          category: "Exams",
          type: "JPG",
          size: "49 KB",
          date: "30 May 2026",
          path: "/public/downloads/exam-schedule-2025-26.jpeg",
          description: "Annual examination and unit test schedule for 2025-26."
        },
        {
          id: "calendar",
          title: "ACADEMIC CALENDER 2026-27",
          category: "Academic",
          type: "XLS",
          size: "1.5 KB",
          date: "30 May 2026",
          path: "/public/downloads/academic-calendar-2026-27.xls",
          description: "Academic calendar file for session planning."
        },
        {
          id: "iks-stem",
          title: "IKS STEM LINK",
          category: "Academic",
          type: "HTML",
          size: "2.0 KB",
          date: "30 May 2026",
          path: "/public/downloads/iks-stem-link.html",
          description: "Reserved resource page for IKS and STEM learning links."
        },
        {
          id: "prospectus",
          title: "DEMS PROSPECTUS FINAL",
          category: "Academic",
          type: "DOCX",
          size: "35 KB",
          date: "30 May 2026",
          path: "/public/downloads/dems-prospectus-final.docx",
          description: "Final school prospectus document for parents and visitors."
        },
        {
          id: "philosophy",
          title: "DEMS PHILOSOPHY VISION ACADEMIC REPORT",
          category: "Reports",
          type: "DOCX",
          size: "17 KB",
          date: "30 May 2026",
          path: "/public/downloads/dems-philosophy-vision-academic-report.docx",
          description: "School philosophy, vision and academic report document."
        },
        {
          id: "yearly-report",
          title: "YEARLY REPORT",
          category: "Reports",
          type: "DOCX",
          size: "16 KB",
          date: "30 May 2026",
          path: "/public/downloads/yearly-report.docx",
          description: "Annual school report and yearly academic highlights."
        },
        {
          id: "dems-ppt",
          title: "DEMS PPT",
          category: "Presentations",
          type: "PPTX",
          size: "11 MB",
          date: "30 May 2026",
          path: "/public/downloads/dems-ppt.pptx",
          description: "DEMS school presentation deck."
        },
        {
          id: "presentation",
          title: "PRESENTATION",
          category: "Presentations",
          type: "PPTX",
          size: "242 KB",
          date: "30 May 2026",
          path: "/public/downloads/presentation.pptx",
          description: "Additional school presentation file."
        },
        {
          id: "yearly-activity",
          title: "YEARLY ACTIVITY 2026-27",
          category: "Activities",
          type: "XLS",
          size: "50 KB",
          date: "30 May 2026",
          path: "/public/downloads/yearly-activity-2026-27.xls",
          description: "Yearly activity planning sheet for 2026-27."
        }
      ];

      const categories = ["All", "Results", "Academic", "Exams", "Reports", "Activities", "Presentations"];

      function cx() {
        return Array.from(arguments).filter(Boolean).join(" ");
      }

      function Icon({ type }) {
        const common = "h-6 w-6";
        const icons = {
          Results: h("path", { d: "M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2Zm4-11h8M8 12h8M8 16h5", strokeLinecap: "round", strokeLinejoin: "round" }),
          Academic: h("path", { d: "m3 8 9-4 9 4-9 4-9-4Zm4 3v5c2.8 2 7.2 2 10 0v-5M21 8v7", strokeLinecap: "round", strokeLinejoin: "round" }),
          Exams: h("path", { d: "M8 4h8l3 3v13H5V4h3Zm7 0v4h4M8 12h8M8 16h5", strokeLinecap: "round", strokeLinejoin: "round" }),
          Reports: h("path", { d: "M5 20V4h14v16H5Zm4-11h6M9 13h6M9 17h4", strokeLinecap: "round", strokeLinejoin: "round" }),
          Activities: h("path", { d: "M12 3v5m0 8v5M4 12h5m6 0h5M6.5 6.5l3.5 3.5m4 4 3.5 3.5m0-11L14 10m-4 4-3.5 3.5", strokeLinecap: "round", strokeLinejoin: "round" }),
          Presentations: h("path", { d: "M4 5h16v11H4V5Zm8 11v4m-4 0h8M8 9h8M8 12h5", strokeLinecap: "round", strokeLinejoin: "round" })
        };
        return h("svg", { className: common, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" }, icons[type] || icons.Academic);
      }

      function viewUrl(file) {
        const ext = file.path.split(".").pop().toLowerCase();
        if (["jpg", "jpeg", "png", "webp", "pdf", "html"].includes(ext)) return file.path;
        if (["ppt", "pptx"].includes(ext)) return file.path;
        const liveUrl = window.location.origin + file.path;
        return "https://docs.google.com/gview?embedded=true&url=" + encodeURIComponent(liveUrl);
      }

      function Stat({ label, value }) {
        return h("div", { className: "rounded-3xl border border-white/20 bg-white/14 p-5 shadow-2xl shadow-slate-950/15 backdrop-blur-md" },
          h("p", { className: "text-4xl font-black text-white" }, value),
          h("p", { className: "mt-2 text-sm font-bold text-white/78" }, label)
        );
      }

      function DownloadCard({ file, count, onView, onDownload }) {
        const isPresentation = ["PPT", "PPTX"].includes(file.type);
        return h("article", {
          className: "group relative flex h-full flex-col overflow-hidden rounded-3xl border border-blue-100 bg-white p-5 shadow-[0_18px_55px_rgba(15,23,42,0.08)] transition duration-300 hover:-translate-y-2 hover:border-blue-300 hover:shadow-premium dark:border-slate-800 dark:bg-slate-900"
        },
          h("div", { className: "absolute inset-x-0 top-0 h-2 bg-gradient-to-r from-school-blue via-sky-400 to-cyan-300" }),
          h("div", { className: "flex items-start justify-between gap-4" },
            h("div", { className: "mt-2 flex h-14 w-14 items-center justify-center rounded-2xl bg-school-dark text-white shadow-lg shadow-slate-900/20 ring-1 ring-white/30 transition group-hover:scale-105 group-hover:bg-school-blue dark:bg-blue-600" }, h(Icon, { type: file.category })),
            h("span", { className: "mt-2 rounded-full bg-blue-50 px-3 py-1 text-xs font-black text-school-blue ring-1 ring-blue-100 dark:bg-blue-950/60 dark:text-blue-200 dark:ring-blue-900" }, file.type)
          ),
          h("div", { className: "mt-5 flex-1" },
            h("p", { className: "text-xs font-black uppercase tracking-wide text-school-blue" }, file.category),
            h("h3", { className: "mt-2 min-h-14 text-lg font-black leading-snug text-slate-950 dark:text-white" }, file.title),
            h("p", { className: "mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300" }, file.description)
          ),
          h("div", { className: "mt-5 grid grid-cols-2 gap-3 text-xs font-semibold text-slate-500 dark:text-slate-400" },
            h("span", null, "Size: ", file.size),
            h("span", { className: "text-right" }, file.date)
          ),
          h("div", { className: "mt-5 flex items-center justify-between rounded-2xl bg-blue-50 px-4 py-3 text-sm font-black text-slate-700 ring-1 ring-blue-100 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700" },
            h("span", null, "Downloads"),
            h("span", { className: "text-school-blue" }, count || 0)
          ),
          h("div", { className: "mt-5 grid grid-cols-2 gap-3" },
            h("button", {
              onClick: function () { onView(file); },
              className: "rounded-2xl bg-school-dark px-4 py-3 text-sm font-extrabold text-white shadow-lg shadow-slate-900/15 transition hover:-translate-y-0.5 hover:bg-slate-950 dark:bg-slate-700"
            }, isPresentation ? "Open" : "View"),
            h("a", {
              href: file.path,
              download: true,
              onClick: function () { onDownload(file.id); },
              className: "rounded-2xl bg-gradient-to-r from-school-blue to-sky-500 px-4 py-3 text-center text-sm font-extrabold text-white shadow-lg shadow-blue-600/30 transition hover:-translate-y-0.5 hover:from-blue-700 hover:to-school-blue"
            }, "Download")
          )
        );
      }

      function App() {
        const [query, setQuery] = useState("");
        const [category, setCategory] = useState("All");
        const [modalFile, setModalFile] = useState(null);
        const [dark, setDark] = useState(false);
        const [counts, setCounts] = useState(function () {
          try {
            return JSON.parse(localStorage.getItem("dems-download-counts") || "{}");
          } catch (error) {
            return {};
          }
        });

        React.useEffect(function () {
          document.documentElement.classList.toggle("dark", dark);
        }, [dark]);

        const filtered = useMemo(function () {
          const text = query.trim().toLowerCase();
          return downloads.filter(function (file) {
            const matchesCategory = category === "All" || file.category === category;
            const matchesText = !text || [file.title, file.category, file.type, file.description].join(" ").toLowerCase().includes(text);
            return matchesCategory && matchesText;
          });
        }, [query, category]);

        const latest = downloads.slice(0, 4);
        const totalDownloads = Object.values(counts).reduce(function (sum, value) { return sum + Number(value || 0); }, 0);

        function increment(id) {
          setCounts(function (current) {
            const next = Object.assign({}, current, { [id]: Number(current[id] || 0) + 1 });
            localStorage.setItem("dems-download-counts", JSON.stringify(next));
            return next;
          });
        }

        function openFile(file) {
          const isPresentation = ["PPT", "PPTX"].includes(file.type);
          if (isPresentation) {
            increment(file.id);
            window.location.href = file.path;
            return;
          }
          setModalFile(file);
        }

        return h("div", { className: "min-h-screen" },
          h("header", {
            className: "relative overflow-hidden bg-school-dark bg-cover bg-center text-white",
            style: { backgroundImage: "linear-gradient(120deg, rgba(31, 41, 55, 0.98) 0%, rgba(31, 41, 55, 0.94) 48%, rgba(37, 99, 235, 0.78) 100%), url('assets/images/dems/real/staff-group.jpg')" }
          },
            h("div", { className: "absolute inset-0 bg-[radial-gradient(circle_at_88%_12%,rgba(147,197,253,0.42),transparent_30%),radial-gradient(circle_at_18%_80%,rgba(37,99,235,0.32),transparent_32%)]" }),
            h("div", { className: "absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-[#f3f7ff] to-transparent dark:from-slate-950" }),
            h("nav", { className: "relative mx-auto flex max-w-[1500px] items-center justify-between px-5 py-5 sm:px-8" },
              h("a", { href: "index.html", className: "flex items-center gap-3 text-white no-underline" },
                h("span", { className: "grid h-11 w-11 place-items-center rounded-2xl bg-school-blue font-black" }, "D"),
                h("span", null,
                  h("span", { className: "block text-lg font-black leading-none" }, "DEMS"),
                  h("span", { className: "text-xs font-medium text-white/70" }, "School Portal")
                )
              ),
              h("div", { className: "flex items-center gap-3" },
                h("a", { href: "index.html", className: "hidden rounded-full border border-white/25 bg-white/10 px-4 py-2 text-sm font-bold text-white shadow-lg shadow-black/10 backdrop-blur transition hover:bg-white hover:text-school-dark sm:inline-flex" }, "Back to Website"),
                h("button", {
                  onClick: function () { setDark(!dark); },
                  className: "rounded-full border border-white/25 bg-white/10 px-4 py-2 text-sm font-bold text-white shadow-lg shadow-black/10 backdrop-blur transition hover:bg-white hover:text-school-dark"
                }, dark ? "Light Mode" : "Dark Mode")
              )
            ),
            h("section", { className: "relative mx-auto grid max-w-[1500px] gap-10 px-5 pb-20 pt-8 sm:px-8 lg:grid-cols-[1.18fr_0.82fr] lg:pb-28 lg:pt-16" },
              h("div", null,
                h("span", { className: "inline-flex rounded-full bg-blue-600 px-5 py-2 text-xs font-black uppercase tracking-wide text-white shadow-lg shadow-blue-950/30 ring-1 ring-white/20" }, "Official Resources"),
                h("h1", { className: "mt-6 max-w-4xl text-4xl font-black leading-tight tracking-tight sm:text-6xl lg:text-7xl" }, "DEMS School Download Center"),
                h("p", { className: "mt-6 max-w-3xl text-lg leading-8 text-white/78 sm:text-xl" }, "Download Academic Reports, Results, Calendars, Schedules & Presentations"),
                h("div", { className: "mt-8 flex flex-wrap gap-3" },
                  h("a", { href: "#resources", className: "rounded-full bg-gradient-to-r from-school-blue to-sky-400 px-7 py-4 text-sm font-black text-white shadow-xl shadow-blue-950/30 transition hover:-translate-y-0.5 hover:from-blue-700 hover:to-school-blue" }, "Browse Resources"),
                  h("a", { href: "#latest", className: "rounded-full border border-white/30 bg-white/10 px-7 py-4 text-sm font-black text-white shadow-xl shadow-black/10 backdrop-blur transition hover:bg-white hover:text-school-dark" }, "Latest Uploads")
                )
              ),
              h("div", { className: "grid content-end gap-4 sm:grid-cols-3 lg:grid-cols-1" },
                h(Stat, { label: "Resources", value: downloads.length }),
                h(Stat, { label: "Categories", value: categories.length - 1 }),
                h(Stat, { label: "Downloads", value: totalDownloads })
              )
            )
          ),
          h("main", { id: "resources", className: "mx-auto max-w-[1500px] px-5 py-12 sm:px-8 lg:py-16" },
            h("section", { className: "-mt-20 rounded-[2rem] border border-blue-100 bg-white/95 p-4 shadow-premium backdrop-blur dark:border-slate-800 dark:bg-slate-900/95 sm:p-5" },
              h("div", { className: "grid gap-4 lg:grid-cols-[1fr_auto]" },
                h("label", { className: "relative block" },
                  h("span", { className: "sr-only" }, "Search resources"),
                  h("input", {
                    value: query,
                    onChange: function (event) { setQuery(event.target.value); },
                    placeholder: "Search results, calendars, reports, schedules...",
                    className: "h-14 w-full rounded-2xl border border-blue-100 bg-blue-50/60 px-5 text-sm font-bold outline-none transition placeholder:text-slate-400 focus:border-school-blue focus:bg-white focus:ring-4 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-950 dark:focus:bg-slate-900"
                  })
                ),
                h("div", { className: "flex gap-2 overflow-x-auto pb-1 lg:pb-0" },
                  categories.map(function (item) {
                    return h("button", {
                      key: item,
                      onClick: function () { setCategory(item); },
                      className: cx(
                        "whitespace-nowrap rounded-2xl px-5 py-3 text-sm font-black transition",
                        category === item
                          ? "bg-school-dark text-white shadow-lg shadow-slate-900/20 ring-1 ring-school-dark"
                          : "bg-blue-50 text-school-blue ring-1 ring-blue-100 hover:bg-school-blue hover:text-white dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700"
                      )
                    }, item);
                  })
                )
              )
            ),
            h("section", { className: "mt-8 grid gap-6 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4" },
              filtered.map(function (file) {
                return h(DownloadCard, {
                  key: file.id,
                  file: file,
                  count: counts[file.id],
                  onView: openFile,
                  onDownload: increment
                });
              })
            ),
            filtered.length === 0 && h("div", { className: "mt-8 rounded-3xl border border-dashed border-slate-300 bg-white p-10 text-center dark:border-slate-700 dark:bg-slate-900" },
              h("h2", { className: "text-2xl font-black" }, "No resources found"),
              h("p", { className: "mt-2 text-slate-500" }, "Try another category or search keyword.")
            ),
            h("section", { id: "latest", className: "mt-14 grid gap-6 lg:grid-cols-[0.82fr_1.18fr]" },
              h("div", { className: "rounded-[2rem] bg-[linear-gradient(135deg,#1F2937,#111827_58%,#2563EB)] p-8 text-white shadow-premium" },
                h("p", { className: "text-sm font-black uppercase tracking-wide text-blue-300" }, "Latest Uploads"),
                h("h2", { className: "mt-3 text-3xl font-black" }, "Recently added school resources"),
                h("p", { className: "mt-4 leading-7 text-white/70" }, "New files can be added later by placing them inside the downloads folder and adding one item to the resources array in this page."),
                h("div", { className: "mt-8 rounded-3xl border border-dashed border-white/25 bg-white/5 p-5" },
                  h("p", { className: "text-sm font-black text-white" }, "Future Admin Upload Panel"),
                  h("p", { className: "mt-2 text-sm leading-6 text-white/65" }, "Reserved for future login-based file upload, category management and automatic file-size detection.")
                )
              ),
              h("div", { className: "grid gap-4" },
                latest.map(function (file) {
                  return h("button", {
                    key: file.id,
                    onClick: function () { openFile(file); },
                    className: "flex items-center gap-4 rounded-3xl border border-blue-100 bg-white p-4 text-left shadow-sm transition hover:-translate-y-1 hover:border-blue-300 hover:shadow-lg dark:border-slate-800 dark:bg-slate-900"
                  },
                    h("span", { className: "flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-school-dark text-white dark:bg-blue-600" }, h(Icon, { type: file.category })),
                    h("span", { className: "min-w-0 flex-1" },
                      h("span", { className: "block truncate font-black" }, file.title),
                      h("span", { className: "mt-1 block text-sm font-semibold text-slate-500 dark:text-slate-400" }, file.category, " • ", file.date)
                    ),
                    h("span", { className: "rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-500 dark:bg-slate-800" }, file.type)
                  );
                })
              )
            )
          ),
          h("footer", { className: "border-t border-slate-200 bg-white px-5 py-8 text-center text-sm font-semibold text-slate-500 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-400" }, "© 2026 DEMS School Portal"),
          modalFile && h("div", { className: "fixed inset-0 z-50 grid place-items-center bg-slate-950/75 p-4 backdrop-blur-sm" },
            h("div", { className: "flex max-h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-[2rem] bg-white shadow-premium dark:bg-slate-900" },
              h("div", { className: "flex items-center justify-between gap-4 border-b border-slate-200 p-4 dark:border-slate-800 sm:p-5" },
                h("div", { className: "min-w-0" },
                  h("p", { className: "text-xs font-black uppercase tracking-wide text-school-blue" }, modalFile.category),
                  h("h2", { className: "truncate text-lg font-black sm:text-xl" }, modalFile.title)
                ),
                h("div", { className: "flex gap-2" },
                  h("a", {
                    href: modalFile.path,
                    download: true,
                    onClick: function () { increment(modalFile.id); },
                    className: "rounded-2xl bg-school-blue px-4 py-2 text-sm font-black text-white"
                  }, "Download"),
                  h("button", {
                    onClick: function () { setModalFile(null); },
                    className: "rounded-2xl bg-slate-100 px-4 py-2 text-sm font-black text-slate-700 dark:bg-slate-800 dark:text-white"
                  }, "Close")
                )
              ),
              h("div", { className: "h-[72vh] bg-slate-100 dark:bg-slate-950" },
                ["JPG", "JPEG", "PNG", "WEBP"].includes(modalFile.type)
                  ? h("img", { src: modalFile.path, alt: modalFile.title, className: "h-full w-full object-contain" })
                  : h("iframe", { src: viewUrl(modalFile), title: modalFile.title, className: "h-full w-full border-0" })
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
