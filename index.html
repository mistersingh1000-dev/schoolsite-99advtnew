<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Website Temporarily Suspended</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.78);
        --panel-border: rgba(255, 255, 255, 0.14);
        --text: #ffffff;
        --muted: #cbd5e1;
        --accent: #f59e0b;
        --accent-soft: rgba(245, 158, 11, 0.16);
        --shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.92)),
          radial-gradient(circle at top left, rgba(245, 158, 11, 0.22), transparent 34%),
          radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.18), transparent 32%),
          var(--bg);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 18px;
      }

      .notice-card {
        width: min(760px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .status-icon {
        display: inline-grid;
        width: 78px;
        height: 78px;
        margin-bottom: 26px;
        place-items: center;
        border: 1px solid rgba(245, 158, 11, 0.34);
        border-radius: 50%;
        color: var(--accent);
        background: var(--accent-soft);
      }

      .status-icon svg {
        width: 36px;
        height: 36px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      .message {
        max-width: 620px;
        margin: 24px auto 0;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 21px);
        line-height: 1.7;
      }

      .developer {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 34px;
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.06);
        font-size: 15px;
        font-weight: 700;
      }

      .footer-note {
        margin: 28px 0 0;
        color: rgba(203, 213, 225, 0.72);
        font-size: 13px;
      }

      @media (max-width: 520px) {
        main {
          padding: 20px 14px;
        }

        .notice-card {
          border-radius: 22px;
        }

        .developer {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="notice-card" aria-labelledby="notice-title">
        <div class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
          </svg>
        </div>
        <p class="eyebrow">Temporary Suspension Notice</p>
        <h1 id="notice-title">Website Temporarily Suspended</h1>
        <p class="message">
          This website has been temporarily suspended due to pending payment.
          Kindly contact the website developer for further assistance.
        </p>
        <div class="developer">CodeCraft Marketing</div>
        <p class="footer-note">The project files and source code remain safely preserved for restoration.</p>
      </section>
    </main>
  </body>
</html>
